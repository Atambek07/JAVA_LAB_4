# Имя приложения
spring.application.name=library

# ---------------------------------------------------------------------------
# Подключение к PostgreSQL (контейнер из compose.yaml)
# Пароль БД НЕ хранится в файле — подставляется из переменной окружения.
# Порт по умолчанию 5432; в средах, где 5432 занят, можно указать DB_PORT=5433.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/library
spring.datasource.username=library
spring.datasource.password=${DB_PASSWORD:secret}

# Схема управляется миграциями Flyway, Hibernate только проверяет её
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Дополнительное задание: вывод SQL в журнал
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Логирование SQL с параметрами
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=debug
